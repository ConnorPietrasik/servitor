# Portcullis route for servitor (DECISIONS A6).
#
# Operator merges this file into portcullis's compose/traefik/dynamic/ and
# runs portcullis `make update` (gated by `make doctor` with snapshot +
# auto-rollback). portcullis prunes deployed traefik files absent from its
# repo, so the route must live there, not hand-placed (A2).
#
# Before merging, substitute from the guest's .env:
#   VM_INGRESS_IP  -> the VM ingress address (assigned at provisioning)
#   SERVITOR_PORT  -> the servitor port (settled 8787)
#
# Auth: the only gate is the portcullis auth chain (Authelia 2FA
# forward-auth, auth-chain@file). Servitor authenticates nobody (invariant 3).
# No new UFW rule: the route rides the existing 443; the VM's own firewall
# admits the port from the edge subnet only.
#
# The *.pietrasik.top two_factor wildcard already makes this private by
# default (any authenticated user). Admins-only later = one Authelia rule
# above the wildcard (PLAN §13).
http:
  routers:
    servitor:
      rule: "Host(`servitor.pietrasik.top`)"
      entryPoints:
        - websecure
      middlewares:
        - auth-chain@file
      service: servitor
  services:
    servitor:
      loadBalancer:
        servers:
          - url: "http://VM_INGRESS_IP:SERVITOR_PORT"
        passHostHeader: true
        # SSE contract (stage-6 gate: a stream cut by proxy read-timeout is
        # the dropped-connection bug we are forbidden to reproduce):
        #  - no response buffering, frequent flushes (heartbeats ~15 s;
        #    deltas are disposable, but the stream must never be cut)
        #  - no load-balancer read timeout: a 20-minute bash call emits no
        #    events at all; the heartbeat keeps the connection live
        responseForwarding:
          flushInterval: 100ms
        readTimeout: 0s
