# Portcullis route for servitor.
#
# Operator merges this file into portcullis's compose/traefik/dynamic/ and
# runs portcullis `make update` (gated by `make doctor` with snapshot +
# auto-rollback). portcullis prunes deployed traefik files absent from its
# repo, so the route must live there, not hand-placed.
#
# Before merging, substitute from the guest's .env:
#   VM_INGRESS_IP  -> the VM ingress address (assigned at provisioning)
#   SERVITOR_PORT  -> the servitor port (settled 8787)
#
# Auth: the only gate is the portcullis auth chain (Authelia 2FA
# forward-auth, auth-chain@file). Servitor authenticates nobody (invariant 3).
# No new UFW rule: the route rides the existing 443; the VM's own firewall
# admits the port from the edge subnet only.
#
# The *.pietrasik.top two_factor wildcard already makes this private by
# default (any authenticated user). Admins-only later = one Authelia rule
# above the wildcard.
http:
  routers:
    servitor:
      rule: "Host(`servitor.pietrasik.top`)"
      entryPoints:
        - websecure
      middlewares:
        - auth-chain@file
      service: servitor
  services:
    servitor:
      loadBalancer:
        servers:
          - url: "http://VM_INGRESS_IP:SERVITOR_PORT"
        passHostHeader: true
        # SSE contract: a stream cut by a proxy timeout is the
        # dropped-connection bug we are forbidden to reproduce.
        #  - frequent flushes (heartbeats ~15 s; deltas are disposable, but
        #    the stream must never be cut)
        #  - timeouts: Traefik v3 has NO per-service response timeout —
        #    entrypoint writeTimeout defaults to 0 and backend forwarding
        #    timeouts default to 0, so a 20-minute bash call (zero events)
        #    is never cut; the heartbeat is what keeps the client-side
        #    connection live. flushInterval is v3's only responseForwarding
        #    field (default 100ms, ignored for responses v3 recognizes as
        #    streaming) — set for the record. Do NOT re-add a readTimeout
        #    key: v3 has no such loadBalancer field and silently ignores
        #    unknown ones (that would be dead config).
        responseForwarding:
          flushInterval: 100ms
