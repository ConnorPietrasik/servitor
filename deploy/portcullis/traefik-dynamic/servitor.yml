# Portcullis route for servitor.
#
# Operator merges this file into portcullis's compose/traefik/dynamic/ and
# runs portcullis `make update` (gated by `make doctor` with snapshot +
# auto-rollback). portcullis prunes deployed traefik files absent from its
# repo, so the route must live there, not hand-placed.
#
# Before merging, substitute from the guest's .env:
#   VM_INGRESS_IP  -> the VM ingress address (assigned at provisioning)
#   SERVITOR_PORT  -> the servitor port (settled 8787)
#
# Auth: two gates, both on this route. (1) the portcullis auth chain
# (Authelia 2FA forward-auth, auth-chain@file) authenticates the USER;
# (2) the servitor-edge middleware then injects the edge credential
# (X-Servitor-Edge-Key — its value lives in portcullis's .env as
# SERVITOR_EDGE_KEY and MUST equal the guest's, synced by the servitor
# key slice), which the app re-verifies on every route.
# Gate (2) is what stops a neighbor container on the edge subnet — the
# firewall admits the WHOLE segment, and the proxy's source IP is
# indistinguishable from a neighbor's — from driving the agent or reading
# its files directly. No new UFW rule: the route rides the existing 443;
# the VM's own firewall admits the port from the edge subnet only.
#
# Admins-only: portcullis's authelia/configuration.yml carries the
# servitor.pietrasik.top two_factor + group:admins rule pair ABOVE the
# wildcard (the same pattern as panel.pietrasik.top). Without it, the
# *.pietrasik.top two_factor wildcard would admit ANY authenticated user
# to the agent VM. Both live in the portcullis repo, so this route and the
# rule ship together in one `make update` — keep them in sync.
http:
  routers:
    servitor:
      rule: "Host(`servitor.pietrasik.top`)"
      entryPoints:
        - websecure
      middlewares:
        - auth-chain@file
        - servitor-edge@file
      service: servitor
  services:
    servitor:
      loadBalancer:
        servers:
          - url: "http://VM_INGRESS_IP:SERVITOR_PORT"
        passHostHeader: true
        # SSE contract: a stream cut by a proxy timeout is the
        # dropped-connection bug we are forbidden to reproduce.
        #  - frequent flushes (heartbeats ~15 s; deltas are disposable, but
        #    the stream must never be cut)
        #  - timeouts: Traefik v3 has NO per-service response timeout —
        #    entrypoint writeTimeout defaults to 0 and backend forwarding
        #    timeouts default to 0, so a 20-minute bash call (zero events)
        #    is never cut; the heartbeat is what keeps the client-side
        #    connection live. flushInterval is v3's only responseForwarding
        #    field (default 100ms, ignored for responses v3 recognizes as
        #    streaming) — set for the record. Do NOT re-add a readTimeout
        #    key: v3 has no such loadBalancer field and silently ignores
        #    unknown ones (that would be dead config).
        responseForwarding:
          flushInterval: 100ms
